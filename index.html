<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Manga Kissa</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #141824; }
      body { font-family: ui-monospace, 'SF Mono', Menlo, monospace; color: #e8e4d8; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }

      #inspector { user-select: text; -webkit-user-select: text; }

      #hud-clock .day { font-size: 12px; color: #9aa3b8; display: block; }

      #hud-speed { bottom: 14px; left: 14px; display: flex; gap: 6px; align-items: center; }
      #hud-speed span { font-size: 11px; color: #9aa3b8; margin-right: 4px; }
      button {
        font: inherit; font-size: 13px; color: #e8e4d8; background: #262c3d;
        border: 1px solid #3a4156; border-radius: 6px; padding: 6px 12px; cursor: pointer;
      }
      button:hover { background: #313950; }
      button.active { background: #4a5578; border-color: #6b779c; }

      #inspector .bar { height: 8px; background: #262c3d; border-radius: 4px; overflow: hidden; margin-top: 2px; }
      #inspector .bar i { display: block; height: 100%; background: #d9a15e; border-radius: 4px; }
      #inspector .action { color: #ffd166; }

      #follow-tag { top: 60px; left: 14px; font-size: 13px; color: #ffd166; display: none; }
      #inspector h3 { cursor: pointer; }

      }
      #report h3 { font-size: 14px; color: #ffd166; margin-bottom: 8px; }
      #report .big { font-size: 16px; margin: 6px 0; }
      #report table { width: 100%; border-collapse: collapse; margin: 8px 0; color: #c9d0e0; }
      #report td { padding: 2px 4px; }
      #report td:last-child { text-align: right; }
      #report .row { margin: 6px 0; color: #9aa3b8; }
      #report button { margin-top: 8px; width: 100%; }
      #hint {
        display: none; bottom: 14px; left: 50%; transform: translateX(-50%);

      }
      #feed {
        display: none; top: 96px; left: 14px; width: 300px; max-height: 58vh;

      /* Móvil y tablet: paneles compactos, botones con área táctil decente.

      @media (max-width: 760px) {
        #hud-clock { top: 8px; left: 8px; font-size: 16px; padding: 6px 10px; }
        #hud-clock .cash { font-size: 11px; }
        #hud-modes { top: 88px; left: 8px; right: auto; gap: 4px; }
        #hud-speed { bottom: 8px; left: 8px; }
        #follow-tag { top: 140px; left: 8px; font-size: 12px; }
        #feed { top: 140px; left: 8px; width: min(280px, 78vw); max-height: 46vh; }

        #hint { bottom: 62px; left: 8px; transform: none; max-width: 40vw; text-align: left; }
        button { padding: 10px 12px; font-size: 12px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CiB424R9.js"></script>
  </head>

    <div id="app"></div>

    <div id="hud-modes" class="panel"></div>
    <div id="hud-speed" class="panel"></div>
    <div id="inspector" class="panel"></div>
    <div id="report" class="panel"></div>
    <div id="hint" class="panel"></div>
    <div id="feed" class="panel"></div>

</html>
